<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Offline Single Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .bird {
            position: absolute;
            width: 40px;
            height: 40px;
            left: 50px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="%23FFD700"/><circle cx="25" cy="15" r="5" fill="%23000"/><polygon points="35,20 40,18 40,22" fill="%23FF6347"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .pipe {
            position: absolute;
            width: 60px;
            background: linear-gradient(90deg, #2d5016 0%, #3d7e1f 50%, #2d5016 100%);
            border: 2px solid #1a3009;
            border-radius: 5px;
        }

        .pipe.top {
            background: linear-gradient(90deg, #2d5016 0%, #3d7e1f 50%, #2d5016 100%);
        }

        .pipe.bottom {
            background: linear-gradient(90deg, #2d5016 0%, #3d7e1f 50%, #2d5016 100%);
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to bottom, #8B7355 0%, #654321 100%);
            border-top: 3px solid #3d2817;
        }

        .ground::before,
        .ground::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 10px;
            background: repeating-linear-gradient(90deg, #3d2817 0px, #3d2817 20px, transparent 20px, transparent 40px);
            top: 5px;
        }

        .ground::after {
            top: 20px;
            background: repeating-linear-gradient(90deg, #654321 0px, #654321 20px, transparent 20px, transparent 40px);
        }

        .ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-ui {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            border-radius: 10px;
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-content {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .game-over-content h1 {
            color: #d32f2f;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .game-over-content p {
            color: #333;
            font-size: 1.2em;
            margin: 10px 0;
        }

        .game-over-content .final-score {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }

        .game-over-content .best-score {
            font-size: 1em;
            color: #666;
            margin: 10px 0;
        }

        .game-over-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }

        .game-over-buttons button {
            padding: 12px 30px;
            font-size: 1.1em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .game-over-buttons button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .instructions {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.9em;
            display: none;
            pointer-events: none;
        }

        .instructions.show {
            display: block;
        }

        @keyframes flap {
            0% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(-15deg);
            }
            100% {
                transform: rotate(0deg);
            }
        }

        .bird.flapping {
            animation: flap 0.1s;
        }

        .combo-text {
            position: absolute;
            color: gold;
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            display: none;
        }

        .combo-text.show {
            display: block;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px);
            }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <div class="bird" id="bird"></div>
        
        <div class="ui">
            <div class="top-ui">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="score">Best: <span id="bestScore">0</span></div>
            </div>
        </div>

        <div class="instructions" id="instructions">
            Click or Press SPACE to Flap
        </div>

        <div class="ground"></div>

        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-content">
                <h1>Game Over!</h1>
                <p>Your Bird Hit an Obstacle</p>
                <div class="final-score">Score: <span id="finalScore">0</span></div>
                <div class="best-score">Best Score: <span id="bestScoreModal">0</span></div>
                <div class="game-over-buttons">
                    <button onclick="restartGame()">Play Again</button>
                    <button onclick="goToMenu()">Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const bird = document.getElementById('bird');
        const scoreDisplay = document.getElementById('score');
        const bestScoreDisplay = document.getElementById('bestScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const bestScoreModalDisplay = document.getElementById('bestScoreModal');
        const instructions = document.getElementById('instructions');

        // Game variables
        const gameWidth = 400;
        const gameHeight = 600;
        const groundHeight = 50;
        const birdSize = 40;
        const pipeWidth = 60;
        const gapSize = 120;
        const pipeSpeed = 6;

        let birdY = gameHeight / 2;
        let birdX = 50;
        let velocity = 0;
        let gravity = 0.5;
        let score = 0;
        let bestScore = localStorage.getItem('flappyBirdBestScore') || 0;
        let gameActive = false;
        let pipes = [];
        let pipeCounter = 0;
        let gameStarted = false;

        // Initialize
        bestScoreDisplay.textContent = bestScore;
        bestScoreModalDisplay.textContent = bestScore;

        function drawBird() {
            bird.style.top = birdY + 'px';
            bird.style.left = birdX + 'px';
        }

        function createPipe() {
            const topPipeHeight = Math.random() * (gameHeight - groundHeight - gapSize - 50) + 30;
            const bottomPipeHeight = gameHeight - groundHeight - topPipeHeight - gapSize;

            const topPipe = document.createElement('div');
            topPipe.className = 'pipe top';
            topPipe.style.height = topPipeHeight + 'px';
            topPipe.style.right = '-' + pipeWidth + 'px';
            topPipe.style.top = '0px';
            topPipe.dataset.passed = 'false';
            gameContainer.appendChild(topPipe);

            const bottomPipe = document.createElement('div');
            bottomPipe.className = 'pipe bottom';
            bottomPipe.style.height = bottomPipeHeight + 'px';
            bottomPipe.style.right = '-' + pipeWidth + 'px';
            bottomPipe.style.bottom = groundHeight + 'px';
            gameContainer.appendChild(bottomPipe);

            pipes.push({
                x: gameWidth,
                topHeight: topPipeHeight,
                bottomHeight: bottomPipeHeight,
                topElement: topPipe,
                bottomElement: bottomPipe,
                passed: false
            });
        }

        function checkCollision() {
            // Check ground collision
            if (birdY + birdSize >= gameHeight - groundHeight) {
                return true;
            }

            // Check ceiling collision
            if (birdY <= 0) {
                return true;
            }

            // Check pipe collision
            for (let pipe of pipes) {
                const birdLeft = birdX;
                const birdRight = birdX + birdSize;
                const birdTop = birdY;
                const birdBottom = birdY + birdSize;

                const pipeLeft = pipe.x;
                const pipeRight = pipe.x + pipeWidth;

                if (birdRight > pipeLeft && birdLeft < pipeRight) {
                    const topPipeBottom = pipe.topHeight;
                    const bottomPipeTop = gameHeight - groundHeight - pipe.bottomHeight;

                    if (birdTop < topPipeBottom || birdBottom > bottomPipeTop) {
                        return true;
                    }
                }
            }

            return false;
        }

        function update() {
            if (!gameActive) return;

            // Apply gravity
            velocity += gravity;
            birdY += velocity;

            // Move pipes
            pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);

            pipes.forEach((pipe, index) => {
                pipe.x -= pipeSpeed;
                pipe.topElement.style.right = (gameWidth - pipe.x) + 'px';
                pipe.bottomElement.style.right = (gameWidth - pipe.x) + 'px';

                // Score when pipe is passed
                if (!pipe.passed && pipe.x + pipeWidth < birdX) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = score;

                    // Visual feedback
                    if (score % 5 === 0) {
                        showCombo();
                    }
                }
            });

            // Create new pipes
            pipeCounter++;
            if (pipeCounter > 80) {
                createPipe();
                pipeCounter = 0;
            }

            // Check collisions
            if (checkCollision()) {
                endGame();
                return;
            }

            drawBird();
            requestAnimationFrame(update);
        }

        function showCombo() {
            const combo = document.createElement('div');
            combo.className = 'combo-text show';
            combo.textContent = '+' + score;
            combo.style.left = birdX + 'px';
            combo.style.top = birdY + 'px';
            gameContainer.appendChild(combo);

            setTimeout(() => combo.remove(), 1000);
        }

        function flap() {
            if (!gameActive) return;
            velocity = -12;
            bird.classList.add('flapping');
            setTimeout(() => bird.classList.remove('flapping'), 100);
        }

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            gameActive = true;
            instructions.classList.remove('show');
            update();
        }

        function endGame() {
            gameActive = false;
            gameOverScreen.classList.add('show');
            finalScoreDisplay.textContent = score;
            bestScoreModalDisplay.textContent = bestScore;

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('flappyBirdBestScore', bestScore);
                bestScoreDisplay.textContent = bestScore;
                bestScoreModalDisplay.textContent = bestScore;
            }
        }

        function restartGame() {
            // Reset game state
            birdY = gameHeight / 2;
            velocity = 0;
            score = 0;
            pipeCounter = 0;
            gameActive = false;
            gameStarted = false;
            scoreDisplay.textContent = '0';
            gameOverScreen.classList.remove('show');

            // Remove all pipes
            pipes.forEach(pipe => {
                pipe.topElement.remove();
                pipe.bottomElement.remove();
            });
            pipes = [];

            drawBird();
            instructions.classList.add('show');
        }

        function goToMenu() {
            restartGame();
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameStarted) {
                    startGame();
                } else if (gameActive) {
                    flap();
                }
            }
        });

        gameContainer.addEventListener('click', () => {
            if (!gameStarted) {
                startGame();
            } else if (gameActive) {
                flap();
            }
        });

        // Mobile touch support
        gameContainer.addEventListener('touchstart', () => {
            if (!gameStarted) {
                startGame();
            } else if (gameActive) {
                flap();
            }
        });

        // Initialize
        drawBird();
        bestScoreDisplay.textContent = bestScore;
        bestScoreModalDisplay.textContent = bestScore;
        instructions.classList.add('show');
    </script>
</body>
</html>
